# Publishes build/ui-bundle.zip as a GitHub release whenever a v* tag is pushed.
# jbang.dev's Antora playbook consumes releases/latest/download/ui-bundle.zip.
name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx gulp bundle
      - name: Create release
        run: gh release create "$TAG" build/ui-bundle.zip --title "jbang-antora-ui $TAG" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
